[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switch-migrator"
version = "1.0.0"
description = "Pre-migration audit & compare tool for Extreme VOSS/Fabric Engine and ERS switches against SPB fabric (BCB) state"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "netmiko>=4.3,<5",
    # paramiko 4.x removed ssh-dss host keys still used by old ERS/BOSS gear
    "paramiko>=3.4,<4",
    "PyYAML>=6.0",
    "rich>=13.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
switch-migrator = "switch_migrator.cli:main"

[tool.setuptools.packages.find]
include = ["switch_migrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# the same rule families as pre-migration-checker
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PIE", "RET", "PT"]

[tool.mypy]
python_version = "3.10"
files = ["switch_migrator"]
strict = true

[[tool.mypy.overrides]]
# third-party packages without type information
module = ["netmiko", "netmiko.*", "paramiko", "paramiko.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# optional, Python 3.11+ (it uses enum.StrEnum): not checkable against 3.10
module = ["migration_check", "migration_check.*", "fabric_weft", "fabric_weft.*"]
follow_imports = "skip"
ignore_missing_imports = true
