# =============================================================================
# switch-migrator configuration
#
# Copy to config.yaml and adjust. config.yaml is gitignored on purpose -
# never commit real device data.
#
# Credentials are NEVER stored here. They come from environment variables or
# an interactive prompt (see README, section "Credentials").
# =============================================================================

# --- SPB fabric source of truth -----------------------------------------------
# The DvR controllers to read the fabric state from. All must be VOSS /
# Fabric Engine. Controllers see the domain-wide DvR interfaces (L2 I-SID <->
# VLAN pairs via `show dvr interfaces`) plus fabric-wide I-SIDs via IS-IS.
# The tool merges the view of all listed controllers; I-SIDs and VLAN
# attachments found on ANY of them count as "exists in fabric".
#
# NOTE: with `--no-fabric` (inventory/state report for isolated environments
# whose VLANs/I-SIDs intentionally are NOT in a fabric) this section and the
# isid_conventions section below are OPTIONAL - nothing is compared.
dvr_controllers:
  - name: dvr-01
    host: 10.0.0.1
  - name: dvr-02
    host: 10.0.0.2

# --- Uplink / core identification ----------------------------------------------
# LLDP SysName patterns (shell-style globs, case-insensitive) that identify a
# neighbor as a core/uplink switch. Ports (and MLTs containing such ports) whose
# LLDP neighbor matches one of these patterns are counted as uplinks in the
# report.
core_switch_patterns:
  - "dvr-*"
  - "core-*"
  - "agg-*"

# --- VLAN <-> I-SID convention ---------------------------------------------------
# Used to derive the EXPECTED I-SID for a VLAN. Because your I-SIDs use
# different possible prefixes, list every offset in use; the tool checks all
# candidates against the fabric AND additionally matches by the actual
# VLAN(c-vid) attachment seen on the DvR controllers. Disagreements are flagged.
#
# candidate I-SID = offset + VLAN-ID   (e.g. offset 10000, VLAN 100 -> 10100)
isid_conventions:
  offsets:
    - 10000
    - 20000
  # Per-VLAN overrides win over the offsets (VLAN-ID: I-SID):
  explicit: {}
  #  150: 90150

# --- VLANs to ignore in the comparison -------------------------------------------
# Excluded VLANs still appear in the "VLAN vs Fabric" sheet (status EXCLUDED,
# showing on which switches they exist) but never count as errors.
#
# By NAME (case-insensitive shell globs) - for VLANs that intentionally do
# not exist in the fabric, e.g. a local quarantine VLAN:
excluded_vlan_names:
  - "quarant*"

# By VLAN ID: default VLAN and the VOSS/Fabric Engine reserved range
# (4048-4059, incl. the usual B-VLANs 4051/4052) plus anything site-specific
# like a dedicated IST/vIST VLAN. IDs only - names go in the list above.
excluded_vlans:
  - 1
  - 4000        # example: vIST VLAN
  - 4048
  - 4049
  - 4050
  - 4051
  - 4052
  - 4053
  - 4054
  - 4055
  - 4056
  - 4057
  - 4058
  - 4059

# --- SSH settings -----------------------------------------------------------------
ssh:
  conn_timeout: 20        # seconds to establish the SSH connection
  read_timeout: 60        # seconds to wait for a command to finish
  workers: 4              # parallel device connections
  retries: 1              # reconnect attempts after a connection failure
  # Old ERS/BOSS gear only speaks SHA-1 kex, CBC ciphers and ssh-rsa/ssh-dss
  # host keys. true appends those to the client's algorithm lists (modern
  # algorithms keep priority, current devices are unaffected). Client-side
  # only - no device or OS configuration is touched.
  legacy_algorithms: true

  # --- Stubborn ERS/BOSS reachability -------------------------------------------
  # If an ERS fails with "ReadTimeout: Pattern not detected: '(?:\#|>)'", the
  # SSH transport actually connected fine (that is NOT a cipher problem) - the
  # device just didn't present a '#'/'>' prompt in time. The tool already
  # retries the prompt read; these two knobs help the most stubborn boxes:
  #
  # global_delay_factor: multiply every read wait. Slow ERS CPUs sometimes need
  # 2-3 here. Only raise it if the default fails; it slows every device down.
  # global_delay_factor: 2
  #
  # default_enter: a few ERS/BOSS boxes only answer a CR+LF, not the default
  # bare "\n", which leaves prompt detection hanging. Uncomment to force CR+LF:
  # default_enter: "\r\n"
  #
  # disabled_algorithms (advanced, last resort): if the connect log shows the
  # channel connected but returned garbage, a modern algorithm the device
  # negotiates but implements badly is to blame. Pin it OUT here. Keys are
  # paramiko's: kex / ciphers / keys (host keys).
  # disabled_algorithms:
  #   kex: ["curve25519-sha256", "curve25519-sha256@libssh.org"]
